name: Render Great House Farm final trailer
# final render trigger: corrected Mary Williams date

on:
  push:
    branches:
      - claude/greathousefarmwiki-criticism-video-70ztld

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy pymupdf imageio-ffmpeg

      - name: Render final trailer
        run: python trailer/make_thriller.py

      - name: Upload finished trailer
        uses: actions/upload-artifact@v4
        with:
          name: great-house-farm-final-trailer
          path: trailer/parcel-a-thriller-trailer.mp4
          if-no-files-found: error
          retention-days: 30
